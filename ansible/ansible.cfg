[defaults]
inventory = inventory.ini
# Host keys used to churn on every from-scratch reflash (dropbear
# generates a fresh one whenever no host key file is present), which is
# why this used to just disable checking outright. Both real devices
# (core-gateway, ap-upstairs) now get a STABLE per-device dropbear host
# key baked into the image at build time instead — see openwrt-builder's
# Justfile `device` param and kleinbem-secrets/openwrt/per-device/ — so
# pinning no longer breaks on routine re-provisioning. known_hosts below
# only has entries for those two; a genuinely new device still needs one
# added (or an explicit `ssh-keyscan`) before it'll connect.
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# Repo-root-relative, not ansible.cfg-relative: ssh_args is handed
# straight to the ssh subprocess, which inherits ansible-playbook's own
# CWD — and every Justfile recipe invokes ansible-playbook from the repo
# root (see Justfile's `export ANSIBLE_CONFIG` comment for why this file
# needs that env var to be loaded at all).
ssh_args = -o UserKnownHostsFile=ansible/known_hosts -o StrictHostKeyChecking=yes
