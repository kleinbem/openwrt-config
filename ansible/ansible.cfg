[defaults]
inventory = inventory.ini
# Every device gets a stable dropbear host key baked into its image
# (openwrt-builder `build <profile> <device>`), so pinning survives reflashes.
# A new device needs its known_hosts line first (`just device-key` prints it).
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# Path is relative to the repo root, not this file: ssh inherits
# ansible-playbook's CWD, and every Justfile recipe runs from the repo root.
ssh_args = -o UserKnownHostsFile=ansible/known_hosts -o StrictHostKeyChecking=yes
