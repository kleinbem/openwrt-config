---
# Capture packets on a VLAN (or the WAN) at the gateway and pull the .pcap
# back for Wireshark: `just capture iot 60`, `just capture wan 30`.
# BPF filter or SSD capture dir (/tmp is RAM), from the repo root:
#   ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i ansible/inventory.ini \
#     ansible/capture.yml -e vlan=iot -e 'filter=port 53' -e capture_dir=/mnt/ssd
- name: Packet capture
  hosts: gateways
  gather_facts: false
  vars:
    seconds: 30
    capture_dir: /tmp # point at the SSD mount for long/busy captures (RAM otherwise)
    filter: "" # optional BPF filter, e.g. "port 53" or "host 10.0.20.5"
  tasks:
    - name: Validate a VLAN/target was given
      ansible.builtin.assert:
        that: vlan is defined
        fail_msg: "Pass -e vlan=<name|wan> (e.g. just capture iot 60)"

    - name: Resolve the capture interface from the VLAN name
      ansible.builtin.set_fact:
        cap_iface: >-
          {%- if vlan == 'wan' -%}{{ wan_iface }}
          {%- else -%}br-lan.{{ vlans | selectattr('name', 'equalto', vlan) | map(attribute='id') | first }}
          {%- endif -%}

    # rm first, so a failed run can't fetch an old capture; the always block
    # removes whatever the capture left. busybox timeout passes on tcpdump's
    # own status (0 after SIGTERM); 124/143 cover others.
    - name: Capture and pull the .pcap to ./captures/
      block:
        - name: "Capture for the given seconds on {{ cap_iface }}"
          raw: |
            rm -f {{ capture_dir }}/capture.pcap
            timeout {{ seconds }} tcpdump -i {{ cap_iface }} -s0 -U -w {{ capture_dir }}/capture.pcap {{ filter }}
            rc=$?
            case $rc in 0|124|143) ;; *) echo "tcpdump failed (rc $rc)"; exit "$rc" ;; esac
            [ -s {{ capture_dir }}/capture.pcap ] || { echo "tcpdump wrote no capture file"; exit 1; }

        - name: Fetch the capture
          ansible.builtin.fetch:
            src: "{{ capture_dir }}/capture.pcap"
            dest: "./captures/{{ inventory_hostname }}-{{ vlan }}.pcap"
            flat: true
      always:
        - name: Clean up the capture on the router
          ansible.builtin.file:
            path: "{{ capture_dir }}/capture.pcap"
            state: absent

    - name: Where to find it
      ansible.builtin.debug:
        msg: "Saved ./captures/{{ inventory_hostname }}-{{ vlan }}.pcap — open it in Wireshark."
