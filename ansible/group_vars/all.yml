---
# ---------------------------------------------------------------------------
# Secrets stay out of this public repo, in kleinbem-secrets/openwrt/shared.yaml.
# The lookup is lazy: only tasks that use these vars decrypt (needs the YubiKey).
# Edit with `just secrets::edit openwrt/shared.yaml` from openwrt/.
# ---------------------------------------------------------------------------
_secret_vars: >-
  {{ lookup('community.sops.sops',
            playbook_dir ~ '/../../kleinbem-secrets/openwrt/shared.yaml')
     | from_yaml }}
# The main SSID + passphrase live in their own file, shared/wifi.yaml, which
# hass-pi can also decrypt (ESPHome devices join the same network). Same
# lazy lookup.
_wifi_secret_vars: >-
  {{ lookup('community.sops.sops',
            playbook_dir ~ '/../../kleinbem-secrets/shared/wifi.yaml')
     | from_yaml }}
wifi_ssid: "{{ _wifi_secret_vars.wifi_ssid }}"
wifi_pass: "{{ _wifi_secret_vars.wifi_pass }}"
timezone: "Europe/Dublin" # zonename (needs zoneinfo-europe, baked into image)
# POSIX TZ string for the same zone — always correct even if zoneinfo is
# ever missing; busybox ntpd/date read this. Europe/Dublin = GMT/IST.
timezone_posix: "GMT0IST,M3.5.0/1,M10.5.0"

# ---------------------------------------------------------------------------
# QoS / SQM (roles/qos): cake on the WAN. Set both to ~90-95% of the measured
# line speed to enable; 0 disables it.
# ---------------------------------------------------------------------------
wan_down_mbit: 0 # WAN download Mbit/s (e.g. 500) — 0 disables SQM
wan_up_mbit: 0 # WAN upload   Mbit/s (e.g. 50)  — 0 disables SQM
# Link-layer overhead: "ethernet"/44 suits fibre/ethernet WAN; for VDSL/PPPoE
# use "ethernet"/34, for ATM/ADSL "atm"/44. Adjust at the bench if needed.
qos_linklayer: "ethernet"
qos_overhead: 44

# ---------------------------------------------------------------------------
# banIP feeds (roles/banip): small, high-signal lists only. Sets live in RAM
# and cost CPU per packet, so no big aggregate/country lists; watch `banip -s`.
# ---------------------------------------------------------------------------
banip_feeds:
  - firehol_level1 # spamhaus DROP + dshield + bogons (highest signal)
  - debl # blocklist.de brute-forcers
  - backscatter # spoofed-source / backscatter

# CrowdSec (roles/crowdsec) is gated OFF: the official 25.12 crowdsec +
# crowdsec-firewall-bouncer packages conflict over /etc/config/crowdsec (apk
# won't overwrite), so they're not in the image. Set true AND re-add the two
# packages to the image profile once upstream fixes the conflict.
# https://github.com/openwrt/packages/issues/28615: OpenWrt 25.12 apk packaging file conflict (/etc/config/crowdsec).
crowdsec_enable: false

# ---------------------------------------------------------------------------
# Remote syslog (roles/common): empty IP keeps logs local.
# ---------------------------------------------------------------------------
remote_syslog_ip: "" # e.g. "10.0.0.30" — empty disables
remote_syslog_port: 514
remote_syslog_proto: "udp"

# ---------------------------------------------------------------------------
# UI (roles/ui): "Fleet dashboards" link tiles on the router landing page.
# ---------------------------------------------------------------------------
ui_home_dashboard: "home.kleinbem.dev"
ui_fleet_links:
  # AdGuard runs on the gateway (adguard_local), so it's a "This router" tile.
  - { name: "Home Dashboard", url: "https://home.kleinbem.dev", icon: "🏠", desc: "Everything, aggregated" }
  - { name: "Notifications", url: "https://ntfy.kleinbem.dev", icon: "📣", desc: "ntfy alerts / deploy signal" }
  - { name: "n8n", url: "https://n8n.kleinbem.dev", icon: "📡", desc: "Automation workflows" }
  - { name: "Code", url: "https://code.kleinbem.dev", icon: "💻", desc: "code-server" }
  - { name: "Cache", url: "https://cache.kleinbem.dev", icon: "📦", desc: "Nix binary cache" }

# ---------------------------------------------------------------------------
# Wi-Fi radios + SSIDs (roles/wifi)
# ---------------------------------------------------------------------------
# The main SSID keeps the old router's name and password so clients move over
# unchanged; the other SSIDs derive their names from it.
# `sae-mixed` = WPA2/WPA3 transition; the role forces pure SAE + MFP on 6 GHz.
# `ft` = 802.11r fast roaming, only on guest for now.
wifi_country: "IE"
# Channel widths and channel plan are per board: group_vars/board_<board>.yml.
#
# Minimum per-radio TX power (dBm) the wifi role asserts. Catches the mt76
# BE14000 EEPROM trap where every radio comes up at 6 dBm (fine in the same
# room, nothing one wall away). `wifi_txpower_check: false` skips it.
wifi_min_txpower_dbm: 15
wifi_txpower_check: true

# ---------------------------------------------------------------------------
# Wireless backhaul (roles/wifi + roles/network): one Orbi is wired to a BPI-R4
# (mesh gate), the others join it over encrypted 802.11s (mesh nodes). The mesh
# interface is a tagged trunk on br-lan, so all VLANs work over the air.
# Role comes from inventory.nix tags (group_vars/mesh_*.yml), the radio from
# group_vars/board_<board>.yml. STP is on wherever a backhaul exists.
# `none` = plain wired AP or router.
# ---------------------------------------------------------------------------
wifi_backhaul: none
wifi_backhaul_ifname: mesh0 # pinned so bridge-vlan can list it as a tagged port
wifi_backhaul_mesh_id: kleinbem-backhaul # visible in beacons anyway, not secret
# SAE passphrase for the mesh — add `wifi_backhaul_key` to
# kleinbem-secrets/openwrt/shared.yaml (`just secrets::edit openwrt/shared.yaml`);
# roles/wifi refuses to bring up a backhaul with an empty key.
wifi_backhaul_key: "{{ _secret_vars.wifi_backhaul_key | default('') }}"
wifi_networks:
  # The main SSID stays as it was and MPSK runs on separate SSIDs, so devices
  # move over one at a time. Retire the main SSID once MPSK is proven.

  # 1. Legacy: an exact copy of the old router (WPA2 psk2, 2.4+5 GHz, no
  #    802.11r) so paired devices reconnect without a prompt.
  - name: trusted
    ssid: "{{ wifi_ssid }}"
    key: "{{ wifi_pass }}"
    network: trusted
    bands: [2g, 5g]
    encryption: psk2
    ft: false

  # 2. MPSK: the password picks the VLAN. -W3 (sae-mixed) carries all but
  #    guest; -W2 (WPA2) is for gear that chokes on WPA3 and carries only
  #    iot/cameras, so a cracked WPA2 password exposes only isolated VLANs.
  #    Bench-check: the wpa_psk_file dynamic-VLAN regression (upstream:
  #    openwrt/openwrt#20355, closed 2025-11, so 25.12.x should have the fix),
  #    and whether SAE clients on -W3 get a VLAN at all (wpa_psk_file is WPA2-only).
  - name: mpsk_w3
    ssid: "{{ wifi_ssid }}-W3"
    mpsk: true
    bands: [2g, 5g, 6g]
    encryption: sae-mixed
    ft: false # conservative bring-up; enable once MPSK proven
    default_network: trusted # base bind; dynamic_vlan '2' rejects a PSK with no vlanid
    psk_vlans:
      - { vlan: 10, key: "{{ wifi_pass }}" } # trusted (existing pw → easy move)
      - { vlan: 20, key: "{{ _secret_vars.wifi_pass_iot }}" } # iot
      - { vlan: 30, key: "{{ _secret_vars.wifi_pass_cameras }}" } # cameras
      - { vlan: 50, key: "{{ _secret_vars.wifi_pass_work }}" } # work (WFH laptop)
  - name: mpsk_w2
    ssid: "{{ wifi_ssid }}-W2"
    mpsk: true
    bands: [2g, 5g] # NOT 6g — 6 GHz is WPA3-only; this is the WPA2 tier
    encryption: psk2 # pure WPA2 for maximum legacy-device compatibility
    ft: false
    default_network: iot # base bind (low-trust); dynamic_vlan '2' still requires a vlanid
    # LOW-TRUST VLANs ONLY — never trusted/work on the crackable WPA2 tier.
    psk_vlans:
      - { vlan: 20, key: "{{ _secret_vars.wifi_pass_iot }}" } # iot
      - { vlan: 30, key: "{{ _secret_vars.wifi_pass_cameras }}" } # cameras

  # 3. Guest — plain SSID on purpose (a normal password is far easier to hand a
  #    visitor than an MPSK per-device key). Client-isolated → guest VLAN.
  - name: guest
    ssid: "{{ wifi_ssid }}-Guest"
    key: "{{ _secret_vars.wifi_pass_guest }}"
    network: guest
    bands: [2g, 5g]
    encryption: sae-mixed
    ft: true
    mobility_domain: "4321" # distinct FT domain — guest must not share keys with trusted
    isolate: true # guest clients can't see each other

# ---------------------------------------------------------------------------
# AdGuard resolver — handed to DHCP clients in every VLAN (option 6).
# hass-pi, in the infra VLAN. See ../../../openwrt/docs/NETWORK_PLAN.md.
# ---------------------------------------------------------------------------
adguard_ip: "10.0.0.21" # external AdGuard (hass-pi) — used only when adguard_local is false

# ---------------------------------------------------------------------------
# adguard_local: run AdGuard Home on the gateway (roles/adguard) and point each
# VLAN's DNS (option 6) at its own gateway instead of adguard_ip; the hijack
# still only applies to `filtered` VLANs.
# ---------------------------------------------------------------------------
adguard_local: true

# ---------------------------------------------------------------------------
# WireGuard (roles/wireguard): optional break-glass VPN, NetBird covers normal
# remote access. Off until wg_server_private_key is set in
# kleinbem-secrets/openwrt/gateway.yaml (`wg genkey`) and peers are added.
# ---------------------------------------------------------------------------
wg_server_private_key: "" # gateway-only: set in group_vars/gateways.yml
wg_listen_port: 51820
wg_subnet: "10.9.0.1"
wg_reach: [infra, trusted] # zones VPN clients may reach
wg_peers: [] # e.g. [{ name: phone, public_key: "...", ip: "10.9.0.2" }]

# ---------------------------------------------------------------------------
# NetBird (roles/netbird): joins the router to the fleet mesh. Off until
# netbird_setup_key is in shared.yaml.
# ---------------------------------------------------------------------------
netbird_setup_key: "{{ _secret_vars.netbird_setup_key | default('') }}"
netbird_management_url: "" # empty = NetBird default/cloud

# ---------------------------------------------------------------------------
# VLANs, the source of truth for roles/network. Design and firewall matrix:
# openwrt/docs/NETWORK_PLAN.md. The fleet (all Tang servers) lives in infra;
# keep every LUKS-unlock host in a zone with at least one of its Tang servers.
# `reach_out` = zones this VLAN may initiate to. `dns` sets DNS + input policy:
#   trusted  → input ACCEPT; AdGuard first, own gateway as unfiltered fallback.
#   filtered → input REJECT; AdGuard only, :53 hijacked so hardcoded resolvers
#              can't bypass it.
#   local    → input REJECT; the router's unfiltered dnsmasq, no hijack, so a
#              corporate VPN can use its own DNS.
# ---------------------------------------------------------------------------
vlans:
  - id: 1
    name: infra
    subnet: "10.0.0.0/24"
    gateway: "10.0.0.1"
    dhcp: { start: 100, limit: 100 } # .100–.199; fleet uses static leases below
    wan: true
    dns: trusted
    reach_out: [iot, cameras, trusted] # infra can manage everything
  - id: 10
    name: trusted
    subnet: "10.0.10.0/24"
    gateway: "10.0.10.1"
    dhcp: { start: 50, limit: 200 }
    wan: true
    dns: trusted
    reach_out: [infra, iot, cameras]
  - id: 20
    name: iot
    subnet: "10.0.20.0/24"
    gateway: "10.0.20.1"
    dhcp: { start: 50, limit: 200 }
    wan: true
    dns: filtered
    reach_out: [] # internet only (DNS handled by the `dns` tier), no LAN
  - id: 30
    name: cameras
    subnet: "10.0.30.0/24"
    gateway: "10.0.30.1"
    dhcp: { start: 50, limit: 200 }
    wan: false # no phone-home; trusted/NVR pulls streams
    dns: filtered
    reach_out: []
  - id: 40
    name: guest
    subnet: "10.0.40.0/24"
    gateway: "10.0.40.1"
    dhcp: { start: 50, limit: 200 }
    wan: true
    dns: filtered
    reach_out: [] # internet only
  # WFH corporate laptop: isolated from the home LAN both ways, DNS unfiltered
  # so the employer's VPN resolves. Wi-Fi only (work password on -W3).
  - id: 50
    name: work
    subnet: "10.0.50.0/24"
    gateway: "10.0.50.1"
    dhcp: { start: 50, limit: 200 }
    wan: true
    dns: local
    reach_out: [] # internet only; no reach into infra/iot/cameras/trusted

# ---------------------------------------------------------------------------
# Port → zone map is per board (`port_map` in group_vars/board_<board>.yml).
# An AP's infra address is its generated per-host `mgmt_ip`, never a shared var.
# Bench bootstrap overrides only `ansible_host` (192.168.1.1), so mgmt_ip holds.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Static DHCP reservations
# ---------------------------------------------------------------------------
# Pins fleet hosts to fixed IPs: clevis bindings point at Tang URLs by IP, so a
# drifting lease breaks headless LUKS unlock. The list (with MACs) lives in
# kleinbem-secrets/openwrt/gateway.yaml, loaded only on gateways.
static_leases: [] # gateway-only: set in group_vars/gateways.yml
