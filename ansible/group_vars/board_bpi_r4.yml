---
# Banana Pi BPI-R4 (MediaTek MT7988A, Wi-Fi 7 via the BE14000 / MT7996 card).
# Group membership is generated from inventory.nix (`board = "bpi-r4"`).

# WAN stays on the uci-defaults interface; roles/qos + capture.yml use it.
wan_iface: eth1
lan_iface: eth0

# Full 4 GiB since 2026-10-20 (the former mem=2048M boot cap only protected
# MT7988 HW flow offloading, which stays off). roles/common asserts the
# kernel actually sees it: a `mem=` left in a SAVED U-Boot environment
# silently overrides uEnv.txt, and that is exactly how an old cap survives
# a reflash.
expected_ram_mib: 4096

# Per-band channel widths for the BE14000 (MT7996, Wi-Fi 7 / EHT).
wifi_htmodes: { 2g: "EHT20", 5g: "EHT160", 6g: "EHT320" }
# One radio per band → every radio picks its channel itself.
wifi_channel_plan: {}

# Physical port → zone map (decided 2026-07-17; gateway and AP identical).
# The SFP+ link between the two BPI-R4s is a tagged trunk carrying all VLANs.
# DSA port names (lan1…, sfp2) are the expected BPI-R4 names — bench-verify
# once with `ls /sys/class/net` on the flashed board and adjust here if the
# hardware disagrees.
port_map:
  trunk: [sfp2]
  untagged: { lan1: infra, lan2: trusted, lan3: cameras } # cameras = wired cams
