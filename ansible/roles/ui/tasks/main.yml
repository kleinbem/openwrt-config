---
# ---------------------------------------------------------------------------
# UI/UX — one clean, discoverable web UI.
# ---------------------------------------------------------------------------
# Material as the LuCI theme (in the official feed, unlike argon), plus a
# static hub page at http://<router>/ with tiles for the router's own tools
# and the fleet dashboards.
- name: Set Material as the default LuCI theme
  raw: |
    uci set luci.main.mediaurlbase='/luci-static/material'
    uci commit luci

- name: Deploy the network hub landing page
  ansible.builtin.template:
    src: hub.html.j2
    dest: /www/index.html
    mode: "0644"

# uhttpd serves /www; LuCI lives at /cgi-bin/luci. Point the bare "/" at the
# hub instead of the default LuCI redirect, so the first thing you see is the
# clickable overview. LuCI itself stays one tile away.
- name: Serve the hub at "/" (index before the LuCI redirect)
  raw: |
    uci -q del_list uhttpd.main.index_page='index.html' 2>/dev/null || true
    uci add_list uhttpd.main.index_page='index.html'
    uci commit uhttpd
    /etc/init.d/uhttpd reload 2>/dev/null || true
