---
# ---------------------------------------------------------------------------
# Wi-Fi on every router: the BE14000 (MT7996) on the BPI-R4s, the Wi-Fi 5
# radios on the Orbis. SSIDs in group_vars/all.yml, radio settings per board.
# ---------------------------------------------------------------------------
# One rendered script instead of per-setting tasks: it discovers radios at
# runtime (no Wi-Fi card = clean no-op) and commits/reloads once.

# Names end up in uci section names and shell variable names.
- name: Validate Wi-Fi network names and channel plan bands
  ansible.builtin.assert:
    that:
      - wifi_networks | map(attribute='name') | reject('match', '^[A-Za-z0-9_]+\\Z') | list | length == 0
      - (wifi_channel_plan | default({})).keys() | reject('in', ['2g', '5g', '6g', '60g']) | list | length == 0
    fail_msg: wifi_networks names must match [A-Za-z0-9_]+ and wifi_channel_plan keys must be 2g/5g/6g/60g.
    quiet: true

# Each MPSK key is one wpa_psk_file line: 8-63 characters, or a 64-hex PSK.
# no_log hides the message, hence the task name says what's wrong.
- name: Validate MPSK keys (8-63 chars, no leading/trailing space, no leading '#', no newline)
  ansible.builtin.assert:
    that: _mpsk_keys | reject('match', '^([^\\s#][^\\n]{6,61}[^\\s]|[0-9A-Fa-f]{64})\\Z') | list | length == 0
    quiet: true
  vars:
    _mpsk_keys: >-
      {{ wifi_networks | selectattr('mpsk', 'defined') | selectattr('mpsk')
         | map(attribute='psk_vlans') | flatten | map(attribute='key') | list }}
  no_log: true

# One hostapd wpa_psk_file per `mpsk` SSID, mapping each WPA2 passphrase to a
# vlanid so dynamic_vlan puts the station on the matching br-lan.<vlan>. SAE
# stations aren't covered (open bench check, group_vars/all.yml). Written
# before the wireless config that references it.
- name: Ensure hostapd dir exists
  ansible.builtin.file:
    path: /etc/hostapd
    state: directory
    mode: "0755"

- name: Render MPSK wpa_psk map file(s)
  ansible.builtin.template:
    src: wpa_psk_file.j2
    dest: "/etc/hostapd/{{ item.name }}.wpa_psk"
    mode: "0600"
  loop: "{{ wifi_networks | selectattr('mpsk', 'defined') | selectattr('mpsk') | list }}"
  loop_control:
    label: "{{ item.name }}" # don't print the psk_vlans (passphrases) in the loop header
  no_log: true

- name: Render Wi-Fi uci script
  ansible.builtin.template:
    src: wifi-config.sh.j2
    dest: /tmp/wifi-config.sh
    mode: "0700"
  no_log: true # the rendered script embeds SSIDs + passphrases — keep out of logs/--diff
  diff: false

- name: Apply Wi-Fi configuration (uci commit + wifi reload)
  raw: sh /tmp/wifi-config.sh

- name: Remove rendered script (contains passphrases)
  ansible.builtin.file:
    path: /tmp/wifi-config.sh
    state: absent

# The mt76/BE14000 EEPROM trap can leave every radio at 6 dBm. Assert each AP
# interface reaches wifi_min_txpower_dbm. rc 1 = radios still coming up
# (retried), rc 2 = power really is low (fails at once).
- name: Verify radios transmit at a sane power
  when: wifi_txpower_check | default(true)
  raw: |
    uci -q show wireless | grep -q '=wifi-device$' || { echo "no radios — nothing to check"; exit 0; }
    command -v iw >/dev/null || { echo "iw is missing from the image"; exit 3; }
    list=$(iw dev 2>/dev/null | awk '
      /^[[:space:]]*Interface/ { i = $2; ap = 0 }
      /^[[:space:]]*type AP/   { ap = 1 }
      /^[[:space:]]*txpower/   { if (ap) print i, int($2) }')
    [ -n "$list" ] || { echo "no AP interface up yet"; exit 1; }
    low=$(echo "$list" | awk -v min='{{ wifi_min_txpower_dbm }}' '$2 < min')
    if [ -n "$low" ]; then
      echo "TX power below {{ wifi_min_txpower_dbm }} dBm — mt76 EEPROM/regdb trap? (iface dBm):"
      echo "$low"
      exit 2
    fi
    echo "$list"
  register: wifi_txpower
  changed_when: false
  failed_when: wifi_txpower.rc != 0
  retries: 6
  delay: 5
  until: wifi_txpower.rc != 1

# DAWN (in the image) coordinates the APs over the LAN and steers clients
# to the better one.
- name: Enable and start DAWN roaming daemon
  ansible.builtin.service:
    name: dawn
    enabled: true
    state: started
