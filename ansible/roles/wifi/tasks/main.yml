---
# ---------------------------------------------------------------------------
# Wi-Fi radio role — every OpenWrt AP in the fleet: the tri-band BE14000
# (MT7996) on the BPI-R4s and the Wi-Fi 5 radios of the Orbi units.
# ---------------------------------------------------------------------------
# Spec (locked 2026-07): SSID family derived from the existing secret SSID
# (main network keeps its current name + password so clients survive the
# router swap), country IE, WPA3/SAE (pure SAE forced on 6 GHz), 802.11r
# fast roaming between all APs, DAWN for client steering.
# SSID→VLAN map + bands live in group_vars/all.yml (`wifi_networks`); channel
# widths + the fixed-channel plan per board in group_vars/board_<board>.yml.
# Wireless backhaul (802.11s mesh gate/node for the free-standing Orbi
# satellites): `wifi_backhaul` from group_vars/mesh_*.yml, radio from the board.
#
# The uci logic runs as one rendered shell script instead of per-setting raw
# tasks: it must discover radios at runtime (a board without the Wi-Fi NIC
# fitted is a clean no-op) and commit/reload once, atomically.

# MPSK map file(s): one hostapd wpa_psk_file per `mpsk` SSID, mapping each
# passphrase to a VLAN (vlanid=). hostapd + dynamic_vlan tags stations into
# the right br-lan.<vlan> by which password they used. Written first so the
# wireless config below can reference it. 0600 — contains passphrases.
- name: Ensure hostapd dir exists
  ansible.builtin.file:
    path: /etc/hostapd
    state: directory
    mode: "0755"

- name: Render MPSK wpa_psk map file(s)
  ansible.builtin.template:
    src: wpa_psk_file.j2
    dest: "/etc/hostapd/{{ item.name }}.wpa_psk"
    mode: "0600"
  loop: "{{ wifi_networks | selectattr('mpsk', 'defined') | selectattr('mpsk') | list }}"
  loop_control:
    label: "{{ item.name }}" # don't print the psk_vlans (passphrases) in the loop header
  no_log: true

- name: Render Wi-Fi uci script
  ansible.builtin.template:
    src: wifi-config.sh.j2
    dest: /tmp/wifi-config.sh
    mode: "0700"
  no_log: true # the rendered script embeds SSIDs + passphrases — keep out of logs/--diff
  diff: false

- name: Apply Wi-Fi configuration (uci commit + wifi reload)
  raw: sh /tmp/wifi-config.sh

- name: Remove rendered script (contains passphrases)
  ansible.builtin.file:
    path: /tmp/wifi-config.sh
    state: absent

# The mt76/BE14000 EEPROM trap: every radio silently comes up at 6 dBm (about
# 1/50 of a normal AP), fine in the same room and nothing one wall away — the
# usual root cause behind "the BPI-R4's coverage is bad". Assert each AP
# interface reports ≥ wifi_min_txpower_dbm once hostapd is up. A board
# without radios passes trivially; rc 1 = radios still coming up (retried),
# rc 2 = power really is low (fails right away).
- name: Verify radios transmit at a sane power
  when: wifi_txpower_check | default(true)
  raw: |
    uci -q show wireless | grep -q '=wifi-device$' || { echo "no radios — nothing to check"; exit 0; }
    list=$(iw dev 2>/dev/null | awk '
      /^[[:space:]]*Interface/ { i = $2; ap = 0 }
      /^[[:space:]]*type AP/   { ap = 1 }
      /^[[:space:]]*txpower/   { if (ap) print i, int($2) }')
    [ -n "$list" ] || { echo "no AP interface up yet"; exit 1; }
    low=$(echo "$list" | awk -v min='{{ wifi_min_txpower_dbm }}' '$2 < min')
    if [ -n "$low" ]; then
      echo "TX power below {{ wifi_min_txpower_dbm }} dBm — mt76 EEPROM/regdb trap? (iface dBm):"
      echo "$low"
      exit 2
    fi
    echo "$list"
  register: wifi_txpower
  changed_when: false
  failed_when: wifi_txpower.rc != 0
  retries: 6
  delay: 5
  until: wifi_txpower.rc != 1

# DAWN (in the firmware image) coordinates the two APs over the LAN and
# steers clients to the better one; 802.11r above makes that steer fast.
- name: Enable and start DAWN roaming daemon
  ansible.builtin.service:
    name: dawn
    enabled: true
    state: started
