---
# Stand-ins for the sops files in kleinbem-secrets/openwrt (shared.yaml,
# gateway.yaml), passed as extra vars so the community.sops lookups in
# group_vars never run. Values carry spaces, quotes and $ on purpose: a
# template that doesn't quote them breaks the rendered script's shellcheck.
_secret_vars:
  wifi_ssid: "Dummy Net 'main'"
  wifi_pass: "dummy pass \"one\" $HOME"
  wifi_backhaul_key: "dummy backhaul 'key' $x"
  wifi_pass_iot: "dummy iot `id`"
  wifi_pass_cameras: "dummy cameras; true"
  wifi_pass_work: "dummy work & pass"
  wifi_pass_guest: "dummy guest | pass"
  netbird_setup_key: "00000000-0000-0000-0000-000000000000"
_gateway_secret_vars:
  static_leases:
    - { name: dummy-host, mac: "00:00:00:00:00:01", ip: "10.0.0.250" }
  wg_server_private_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
